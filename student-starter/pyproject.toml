[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusfix"
version = "1.1.0"
description = "CampusFix open-source evaluation starter"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["campusfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusfix"
version = "1.0.0"
description = "Starter repository for the CampusFix open-source evaluation"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["campusfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: CampusFix PR checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Automated tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-starter
    steps:
      - name: Check out the exact commit being tested
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run tests and save report
        id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Publish exact test counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-report.xml")
          if not report.exists():
              summary = "## CampusFix test results\n\nNo test report was produced. Check the install and test logs.\n"
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = total - failures - errors - skipped
              summary = (
                  "## CampusFix test results\n\n"
                  f"- **Total:** {total}\n"
                  f"- **Passed:** {passed}\n"
                  f"- **Failed:** {failures}\n"
                  f"- **Errors:** {errors}\n"
                  f"- **Skipped:** {skipped}\n"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY
      - name: Fail the check if tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
